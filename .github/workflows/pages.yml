name: Publish Aevora review site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare current review build
        shell: bash
        run: |
          set -euo pipefail
          base="https://aevora-reveal-3hgepngsc-aevora6.vercel.app"
          share="87cEnU4xaPfIf5DMUFdKF6a7bElAkNxP"
          mkdir -p _site/previews _site/stills
          curl -fsSL -c /tmp/aevora-cookies "${base}/?_vercel_share=${share}" -o /dev/null
          for asset in index.html styles.css script.js robots.txt aevora-monogram.png lombard-odier-logo-white.png stills/artefact-01-tablet-v2-covered.png previews/aevora-1080-continuous-artefact-loop-preview.mp4; do
            curl -fsSL -b /tmp/aevora-cookies "${base}/${asset}" -o "_site/${asset}"
          done
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
