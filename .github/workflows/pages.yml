name: Deploy Aevora review site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "robots.txt"
      - "sitemap.xml"
      - "og-aevora.jpg"
      - "aevora-favicon-white.b64"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare review build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/previews _site/stills
          cp index.html styles.css script.js robots.txt sitemap.xml aevora-monogram.png og-aevora.jpg _site/
          base64 --decode aevora-favicon-white.b64 > _site/aevora-favicon-white.png
          cp lombard-odier-logo-white.png _site/
          cp stills/artefact-01-tablet-v2-covered.png _site/stills/
          cp previews/aevora-1080-continuous-artefact-loop-preview.mp4 _site/previews/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
